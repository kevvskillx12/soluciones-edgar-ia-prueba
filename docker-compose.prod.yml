services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: soluciones-edgar-ia:prod
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - ollama
    environment:
      APP_NAME: "${APP_NAME:-Soluciones Edgar IA}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Soluciones Edgar IA}"
      PYTHON_PATH: /usr/bin/python3
      OLLAMA_URL: "http://ollama:11434/api/generate"
      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "${RUN_SEEDERS:-true}"
      RUN_RAG_INGEST: "true"
    volumes:
      - app_database:/var/www/html/database
      - app_storage:/var/www/html/storage
      - rag_chroma:/var/www/html/rag/chroma_db
    restart: unless-stopped

  queue:
    image: soluciones-edgar-ia:prod
    depends_on:
      - backend
      - ollama
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=300"]
    environment:
      APP_NAME: "${APP_NAME:-Soluciones Edgar IA}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY}"
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_SCHEME: "${MAIL_SCHEME:-}"
      MAIL_HOST: "${MAIL_HOST:-127.0.0.1}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-hello@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Soluciones Edgar IA}"
      PYTHON_PATH: /usr/bin/python3
      OLLAMA_URL: "http://ollama:11434/api/generate"
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
      RUN_RAG_INGEST: "false"
    volumes:
      - app_database:/var/www/html/database
      - app_storage:/var/www/html/storage
      - rag_chroma:/var/www/html/rag/chroma_db
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull llama3.2:1b'
    restart: "no"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    depends_on:
      - backend
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'test -n "$$CLOUDFLARE_TUNNEL_TOKEN" ||
      (echo "Falta CLOUDFLARE_TUNNEL_TOKEN" >&2; exit 1);
      cloudflared tunnel --no-autoupdate run --token "$$CLOUDFLARE_TUNNEL_TOKEN"'
    restart: unless-stopped

volumes:
  app_database:
  app_storage:
  rag_chroma:
  ollama_models:
